<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MovieGraphs</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141419" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MovieGraphs" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="version" content="" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // The chosen theme (see ThemeService), applied before the first paint so the page doesn't flash.
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
